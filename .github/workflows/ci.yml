name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # 应用以服务器系统时区作为业务时间,生产要求 Asia/Shanghai(见 docker-compose.yml),测试同样依赖它
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Syntax check
        run: python -m compileall -q app plugins scripts migrations
      # 逐文件隔离运行主体功能里已验证稳定通过的测试文件(清单见 .github/ci-test-files.txt)。
      # 业务插件的测试不在 CI 范围内;其余历史测试正在整理,修好后加入清单。
      - name: Friend check browser logic
        run: node --check app/static/js/contact-check.js && node --test tests/contact_check_persistence.test.cjs
      - name: Tests
        env:
          JOBS: "4"
        run: scripts/run_tests_isolated.sh .github/ci-test-files.txt
