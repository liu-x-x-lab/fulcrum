# Hindsight(AI 记忆系统)部署:外部 PostgreSQL(pgvector)+ Hindsight 完整镜像。
# 用法:cp .env.example .env 并填好,然后 docker compose up -d。
# 管理界面 9999 对局域网开放(需登录密钥),API 8888 只监听 127.0.0.1;multi-bot-saas 的 app 容器通过共享网络用 http://hindsight:8888 访问。
services:
  hindsight-db:
    build:
      context: .
      dockerfile: Dockerfile.pg
    image: hindsight-pgvector:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: hindsight
      POSTGRES_PASSWORD: ${PG_PASSWORD:?请在 .env 里设置 PG_PASSWORD}
      POSTGRES_DB: hindsight
    volumes:
      - hindsight-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hindsight -d hindsight"]
      interval: 10s
      timeout: 5s
      retries: 10

  hindsight:
    image: ghcr.io/vectorize-io/hindsight:latest
    restart: unless-stopped
    depends_on:
      hindsight-db:
        condition: service_healthy
    shm_size: 1g
    # 文档要求:关闭时留足时间交还后台任务。
    stop_grace_period: 75s
    # 201 只有 7.7G 内存且还跑着应用与数据库,给 Hindsight 设上限,防止拖垮其他服务。
    mem_limit: 3g
    ports:
      # 管理界面(Control Plane)开放到局域网,登录需要 CP_ACCESS_KEY;
      # API(8888)只监听本机,应用容器走 docker 网络访问,不对局域网开放(它本身没有鉴权)。
      - "9999:9999"
      - "127.0.0.1:8888:8888"
    environment:
      HINDSIGHT_API_DATABASE_URL: postgresql://hindsight:${PG_PASSWORD}@hindsight-db:5432/hindsight
      # 记忆抽取用的 LLM(OpenAI 兼容接口)。
      HINDSIGHT_API_LLM_PROVIDER: openai
      HINDSIGHT_API_LLM_API_KEY: ${LLM_KEY:?请在 .env 里设置 LLM_KEY}
      HINDSIGHT_API_LLM_MODEL: ${LLM_MODEL}
      HINDSIGHT_API_LLM_BASE_URL: ${LLM_BASE_URL}
      # 嵌入用宿主机 Ollama 上的 bge-m3(1024 维,中文效果好),不在容器里再装模型。
      HINDSIGHT_API_EMBEDDINGS_PROVIDER: openai
      HINDSIGHT_API_EMBEDDINGS_OPENAI_BASE_URL: ${EMBED_BASE_URL}
      HINDSIGHT_API_EMBEDDINGS_OPENAI_API_KEY: ollama
      HINDSIGHT_API_EMBEDDINGS_OPENAI_MODEL: ${EMBED_MODEL}
      # bge-m3 的分词器与 Hindsight 不同,输入上限调小一些留余量。
      HINDSIGHT_API_EMBEDDINGS_MAX_INPUT_TOKENS: "2048"
      HINDSIGHT_API_WORKER_ID: hindsight-201
      # 管理界面的登录密钥;不设置时界面是公开的。
      HINDSIGHT_CP_ACCESS_KEY: ${CP_ACCESS_KEY:?请在 .env 里设置 CP_ACCESS_KEY}
      # 当前完整镜像已预置重排模型及分词器。201 启动时直接使用镜像内缓存，
      # 禁止 Hugging Face/Transformers 再请求远端元数据，避免外网波动造成启动重启循环。
      # 升级镜像后应先在无网络的隔离容器验证模型可加载，再替换线上服务。
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    # running 只表示容器进程存在；以 API 真正完成模型与数据库初始化作为就绪标准。
    healthcheck:
      test: ["CMD", "/app/api/.venv/bin/python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8888/health/ready', timeout=4)"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 180s
    networks:
      default: {}
      # 与应用共用网络,app 容器可直接用服务名 hindsight 访问,不占用宿主机端口。
      appnet:
        aliases: [hindsight]

networks:
  appnet:
    external: true
    name: multi-bot-saas_default

volumes:
  hindsight-pg:
